# =============================================================================
# Docker Maintenance — Auto-merge Dependabot PRs (every ecosystem)
# =============================================================================
# Every Dependabot PR reaches this workflow (no paths: filter), so each one
# gets an explicit decision and annotation instead of silently staying open.
# A PR is merged only if it is a patch or minor update (the module's default;
# majors stay open, a 0.x update counts stricter) and the pull_request run of
# docker-release.yml passed on its head commit. That run tests and builds from
# the PR's own manifests and lockfile: tests.yml (biome, tsc, vitest with
# coverage and the build, on Node 24 and 26) and the image build with its
# test stage.
#
#   npm             app/bg-n8n-mcp/package.json + pnpm-lock.yaml
#                   tested and built - patch and minor updates are merged
#   docker          app/bg-n8n-mcp/Dockerfile
#                   image built and tested - but FROM node:${NODE_VERSION}
#                   gives Dependabot no version to read, so it opens no PR;
#                   check-base-images.yml tracks the base image instead
#   docker-compose  docker-compose*.yml
#                   docker-release.yml only VALIDATES these files, it never
#                   starts the stack. Every image is ${VAR:-image}:${VAR:-tag},
#                   which Dependabot does not parse, so it opens no PR. A
#                   literal image tag added here would let its patch and
#                   minor PRs be merged untested - keep the interpolated
#                   form.
#   github-actions  .github/workflows/**
#                   never merged: a CI change stays open for review
#
# A merge made with the GITHUB_TOKEN starts no push workflow, so after the
# merge this workflow dispatches docker-release.yml on main and waits for it
# (release-workflow). That run tests and builds the merged commit again and
# only then:
# 1. Creates a semantic release (fix(...) prefixes cut a patch)
# 2. Builds, scans and pushes the new bg-n8n-mcp image
# A release run that does not succeed turns this job red.
# =============================================================================

name: 🔧 Docker Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write       # merge
  pull-requests: write  # approve, read the PR
  checks: read          # check runs and suites of the PR head commit
  statuses: read        # commit statuses of the PR head commit
  actions: write        # dispatch the release; read workflow runs

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - it
      # runs the tests and builds the image.
      required-workflows: '.github/workflows/docker-release.yml'
      # After a merge - and only then - dispatch the release on main and
      # wait for it: it rebuilds the merged commit before it releases it,
      # and a failed release run fails this job.
      release-workflow: '.github/workflows/docker-release.yml'
    secrets: inherit
