# =============================================================================
# Docker Maintenance — Auto-merge Dependabot PRs (bg-n8n-mcp Dockerfile)
# =============================================================================
# When Dependabot opens a PR bumping the node:26-alpine base image inside
# app/bg-n8n-mcp/Dockerfile, this workflow auto-approves and merges it (after
# validation passes), which then triggers docker-release.yml to build and push
# the updated image.
#
# Scoped to the Dockerfile on purpose. The npm ecosystem is NOT auto-merged:
# a dependency of an OAuth gateway is worth a human reading the changelog, and
# the Docker test stage would catch only what the suite happens to cover.
# =============================================================================

name: 🔧 Docker Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/bg-n8n-mcp/Dockerfile'

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
    secrets: inherit
