# ─────────────────────────────────────────────────────────────────────────────
#  Tests — pull-request and pre-release quality gate
# ─────────────────────────────────────────────────────────────────────────────
#  WHAT
#    The same three commands `pnpm check` runs locally and the Docker test stage
#    runs during the image build: Biome (lint + format), tsc --noEmit with every
#    strict flag, and Vitest with the coverage thresholds enforced.
#
#  WHY IT IS CALLED BY THE RELEASE PIPELINE
#    docker-release.yml lists this workflow in the release job's `needs`, so
#    semantic-release cannot cut a tag, a GitHub Release or a CHANGELOG entry
#    while the suite is red. Without that, a release can be published before a
#    single test has run.
#
#  WHY A MATRIX
#    The production image runs Node 26; `engines` also permits Node 24, which is
#    what a developer on the current Active LTS will have installed. Testing
#    both means the day the base image moves — or the day someone runs the
#    suite locally on 24 — is not the day we find out they diverge.
# ─────────────────────────────────────────────────────────────────────────────

name: 🧪 Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '*.MD'
  workflow_dispatch:
  workflow_call:

# Least privilege: this workflow only reads the checked-out source.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 🔍 Lint, type-check, unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    defaults:
      run:
        working-directory: app/bg-n8n-mcp
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # Installed from npm, not through Corepack: Corepack stopped shipping
      # with Node at 25.0.0, so a corepack-based setup breaks on the Node 26
      # leg of this very matrix.
      #
      # Two non-obvious details, both of which fail loudly but unhelpfully:
      #
      #   * `version` is OMITTED, not set to `false`. Omitting it is what makes
      #     the action read `packageManager` — passing `version: false`
      #     registers as "a version was specified" and the action aborts with
      #     "Multiple versions of pnpm specified".
      #   * `package_json_file` is required because the action looks in the
      #     REPOSITORY ROOT, and this project's manifest lives under app/.
      #     Without it: "Something went wrong, self-installer exits with code 1".
      #
      # The point of the pair is to keep `packageManager` the single source of
      # truth for the pnpm version rather than duplicating the pin here.
      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: app/bg-n8n-mcp/package.json
          run_install: false

      - name: ⚙️ Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: app/bg-n8n-mcp/pnpm-lock.yaml

      - name: 📥 Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: 🎨 Lint & format (biome)
        run: pnpm exec biome check src tests

      - name: 🔍 Type-check (tsc, strict)
        run: pnpm exec tsc -p tsconfig.json --noEmit

      # `env -i` wipes anything the runner exported that the config parser would
      # otherwise pick up during test-time validation — a repository variable
      # named PUBLIC_BASE_URL, say. Mirrors the Dockerfile test stage, so the
      # suite passes or fails for the same reasons in both places.
      - name: 🧪 Unit tests + coverage
        run: env -i HOME="$HOME" PATH="$PATH" CI=1 pnpm exec vitest run --coverage

      - name: 🏗️ Build
        run: pnpm run build

      # A build that emits nothing still "succeeds"; this is the cheap check
      # that the artefact the Dockerfile copies actually exists.
      - name: ✅ Build output is present
        run: test -f dist/main.js

  scripts:
    name: 🧰 Repository scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      # generate-env.mjs is the first thing an operator runs. A broken one is
      # discovered at the worst possible moment, so it is exercised here — and
      # --dry-run proves it parses .env.example and finds both secrets without
      # writing anything.
      - name: 🔑 generate-env.mjs --dry-run
        run: node scripts/generate-env.mjs --dry-run

      - name: 🔑 generate-env.mjs produces a usable .env
        run: |
          node scripts/generate-env.mjs --output .env.ci
          grep -q '^AUTH_STORAGE_ENCRYPTION_KEY=' .env.ci
          ! grep -q 'CHANGE_ME_STORAGE' .env.ci
          ! grep -q 'CHANGE_ME_UPSTREAM' .env.ci
          # 32 bytes base64 is 44 characters including padding.
          test "$(grep '^AUTH_STORAGE_ENCRYPTION_KEY=' .env.ci | cut -d= -f2- | wc -c)" -eq 45

      # Container registries reject uppercase in a repository name, and the
      # repository here is `bauer-group/IP-n8n-MCPServer` — so the obvious thing
      # to write in the workflow is the one that cannot be pushed. Worse, it
      # fails at the END of a release run, after the tag and the GitHub Release
      # have already been cut.
      #
      # The same string also has to match what the compose files and
      # .env.example pull, or an operator gets an image that does not exist.
      # Both properties are asserted here rather than left to a code review.
      - name: 🔠 Image names are lowercase and consistent
        run: |
          set -eu
          bad=$(grep -rhoE "(ghcr-image-name|docker-image-name): *'[^']+'" .github/workflows/ \
                | sed -E "s/.*'(.*)'/\1/" | grep -E '[A-Z]' || true)
          if [ -n "$bad" ]; then
            echo "::error::registry names must be lowercase, found: $bad"
            exit 1
          fi

          ci=$(grep -hoE "ghcr-image-name: *'[^']+'" .github/workflows/docker-release.yml \
               | sed -E "s/.*'(.*)'/\1/" | sort -u)
          test "$(echo "$ci" | wc -l)" -eq 1 || { echo "::error::ghcr-image-name is not consistent"; exit 1; }

          for f in docker-compose.traefik.yml docker-compose.coolify.yml docker-compose.development.yml .env.example; do
            grep -q "ghcr.io/$ci" "$f" || {
              echo "::error::$f does not reference ghcr.io/$ci"; exit 1; }
          done
          echo "image name ok: ghcr.io/$ci"
