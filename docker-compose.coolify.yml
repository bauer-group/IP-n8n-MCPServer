# =============================================================================
# n8n MCP Server — Coolify Deployment
# =============================================================================
# Designed for Coolify's Docker Compose buildpack. Coolify auto-handles:
#   * container + volume naming (UUID-suffixed for project isolation)
#   * the `coolify.managed`, `coolify.applicationId`, `coolify.type` labels
#   * Traefik routing via the SERVICE_FQDN_* magic variable + `expose:` port
#   * SSL provisioning (Let's Encrypt / custom cert via the Coolify UI)
#
# Note: services attach to Coolify's UUID-named resource network automatically.
# A custom `networks:` block here would cause Traefik routing ambiguity
# (504 Gateway Timeout) — that block is intentionally absent, which is also
# why the backend is reached by service name on the shared network.
#
# Operator workflow (Coolify UI):
#   1. Set the domain in the application's "Domains" field
#      -> SERVICE_FQDN_N8NMCP is auto-populated, Traefik is wired
#   2. Set the required environment variables:
#      N8N_ALLOWED_HOSTS (or N8N_ALLOWED_HOST_PATTERN)
#   3. Crypto material (N8N_MCP_AUTH_TOKEN, AUTH_STORAGE_ENCRYPTION_KEY) is
#      auto-generated by Coolify on first deploy and persisted in its DB.
#      IMPORTANT: AUTH_STORAGE_ENCRYPTION_KEY must be 32 bytes base64. Coolify's
#      SERVICE_PASSWORD_* generator does not produce that shape, so generate it
#      once with `openssl rand -base64 32` and paste it in.
#   4. Deploy.
# =============================================================================

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

services:
  n8n-mcp-gateway:
    image: ${N8N_MCP_IMAGE:-ghcr.io/bauer-group/ip-n8n-mcpserver/bg-n8n-mcp}:${N8N_MCP_VERSION:-latest}
    # Force a registry roundtrip on every redeploy so moving tags like :latest
    # / :stable actually refresh — Compose's default `missing` policy otherwise
    # reuses the locally cached image indefinitely once it exists.
    pull_policy: always
    restart: unless-stopped
    <<: *logging

    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}

      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Coolify populates SERVICE_FQDN_N8NMCP from the Domains field.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-${SERVICE_FQDN_N8NMCP}}

      MCP_HOST: ${MCP_HOST:-::}
      MCP_PORT: ${MCP_PORT:-8080}
      MCP_DISPLAY_NAME: ${MCP_DISPLAY_NAME:-BAUER GROUP n8n}
      MCP_WEBSITE_URL: ${MCP_WEBSITE_URL:-https://go.bauer-group.com/mcp-server}

      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      N8N_MCP_URL: http://n8n-mcp-backend:${BACKEND_PORT:-3000}
      N8N_MCP_AUTH_TOKEN: ${N8N_MCP_AUTH_TOKEN:?N8N_MCP_AUTH_TOKEN is required}
      N8N_MCP_TIMEOUT_MS: ${N8N_MCP_TIMEOUT_MS:-120000}

      N8N_ALLOWED_HOSTS: ${N8N_ALLOWED_HOSTS:-}
      N8N_ALLOWED_HOST_PATTERN: ${N8N_ALLOWED_HOST_PATTERN:-}
      N8N_ALLOW_PRIVATE_ADDRESSES: ${N8N_ALLOW_PRIVATE_ADDRESSES:-false}
      N8N_PROBE_TIMEOUT_MS: ${N8N_PROBE_TIMEOUT_MS:-8000}

      AUTH_STORAGE_ENCRYPTION_KEY: ${AUTH_STORAGE_ENCRYPTION_KEY:?AUTH_STORAGE_ENCRYPTION_KEY is required}
      AUTH_REDIS_URL: ${AUTH_REDIS_URL:-redis://redis:6379/0}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-3600}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-2592000}
      AUTH_CODE_TTL: ${AUTH_CODE_TTL:-120}
      AUTH_CLIENT_TTL: ${AUTH_CLIENT_TTL:-31536000}
      MCP_ALLOWED_CLIENT_REDIRECT_URIS: ${MCP_ALLOWED_CLIENT_REDIRECT_URIS:-}

      RATE_LIMITER_ENABLED: ${RATE_LIMITER_ENABLED:-true}
      RATE_LIMITER_LOGIN_MAX: ${RATE_LIMITER_LOGIN_MAX:-10}
      RATE_LIMITER_LOGIN_WINDOW: ${RATE_LIMITER_LOGIN_WINDOW:-900}
      RATE_LIMITER_TOKEN_MAX: ${RATE_LIMITER_TOKEN_MAX:-60}
      RATE_LIMITER_TOKEN_WINDOW: ${RATE_LIMITER_TOKEN_WINDOW:-60}
      RATE_LIMITER_MCP_MAX: ${RATE_LIMITER_MCP_MAX:-600}
      RATE_LIMITER_MCP_WINDOW: ${RATE_LIMITER_MCP_WINDOW:-60}
      RATE_LIMITER_TRUSTED_PROXY_HOPS: ${RATE_LIMITER_TRUSTED_PROXY_HOPS:-1}

    depends_on:
      redis:
        condition: service_healthy
      n8n-mcp-backend:
        condition: service_started

    expose:
      - ${MCP_PORT:-8080}

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${MCP_PORT:-8080}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s


  n8n-mcp-backend:
    image: ${BACKEND_IMAGE:-ghcr.io/czlonkowski/n8n-mcp}:${BACKEND_VERSION:-2.73.0}
    pull_policy: always
    restart: unless-stopped
    <<: *logging

    environment:
      TZ: ${TIME_ZONE:-Etc/UTC}
      NODE_ENV: production

      MCP_MODE: http
      PORT: ${BACKEND_PORT:-3000}
      AUTH_TOKEN: ${N8N_MCP_AUTH_TOKEN:?N8N_MCP_AUTH_TOKEN is required}
      ENABLE_MULTI_TENANT: "true"
      # N8N_API_URL / N8N_API_KEY deliberately absent — see
      # docker-compose.traefik.yml for the advisory this prevents.

      MULTI_TENANT_SESSION_STRATEGY: ${MULTI_TENANT_SESSION_STRATEGY:-instance}
      MULTI_TENANT_ALLOW_CONCURRENT_SESSIONS: ${MULTI_TENANT_ALLOW_CONCURRENT_SESSIONS:-false}
      N8N_MCP_MAX_SESSIONS: ${BACKEND_MAX_SESSIONS:-200}

      TRUST_PROXY: "1"
      AUTH_RATE_LIMIT_MAX: ${BACKEND_AUTH_RATE_LIMIT_MAX:-100}
      AUTH_RATE_LIMIT_WINDOW: ${BACKEND_AUTH_RATE_LIMIT_WINDOW:-900000}

      WEBHOOK_SECURITY_MODE: ${WEBHOOK_SECURITY_MODE:-strict}

      DISABLED_TOOLS: ${DISABLED_TOOLS:-}
      DISABLED_TOOL_OPERATIONS: ${DISABLED_TOOL_OPERATIONS:-}
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}

    expose:
      - ${BACKEND_PORT:-3000}


  redis:
    image: ${REDIS_IMAGE:-redis}:${REDIS_VERSION:-8-alpine}
    restart: unless-stopped
    <<: *logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    mem_limit: ${REDIS_CONTAINER_MEM_LIMIT:-384m}
    expose:
      - 6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  redis-data:
    driver: local
